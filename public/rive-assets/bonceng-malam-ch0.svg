<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="400" height="680">
  <defs>
    <radialGradient id="povWarmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="povBeam" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#FDE047" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jacketGrad" x1="200" y1="200" x2="200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B4A62" />
      <stop offset="0.5" stop-color="#1E293B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="scooterPaint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="helmetRider" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0284C7" />
      <stop offset="1" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="helmetPassenger" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F43F5E" />
      <stop offset="1" stop-color="#BE123C" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND GLOW -->
  <circle id="bg-glow" cx="200" cy="300" r="250" fill="url(#povWarmGlow)" />

  <!-- RIDER & MOTOR GROUP -->
  <g id="character-rider">
    <!-- TORSO & ARMS -->
    <g id="body-jacket">
      <path d="M158 288 C158 252 178 232 200 232 C222 232 242 252 242 288 L258 500 H142 Z" fill="url(#jacketGrad)" stroke="#475569" stroke-width="2.5" />
      <path d="M242 288 C242 252 222 232 200 232" stroke="#FCD34D" stroke-width="3.5" stroke-linecap="round" opacity="0.6" fill="none" />
      <path d="M170 268 C176 288 224 288 230 268" stroke="#64748B" stroke-width="2.5" fill="none" />
      <line x1="200" y1="284" x2="200" y2="500" stroke="#0B1220" stroke-width="3" opacity="0.55" />
      <rect x="187" y="210" width="26" height="28" rx="11" fill="#E5A886" />
    </g>

    <!-- LEFT ARM ON HANDLE -->
    <path id="arm-left" d="M240 300 C262 340 292 400 316 462" stroke="#1E293B" stroke-width="25" stroke-linecap="round" />

    <!-- RIGHT ARM HOLDING HELMET -->
    <path id="arm-right" d="M160 300 C146 342 146 396 152 430" stroke="#1E293B" stroke-width="26" stroke-linecap="round" />

    <!-- HEAD & HELMET RIDER -->
    <g id="head-rider">
      <circle cx="200" cy="158" r="55" fill="url(#helmetRider)" stroke="#38BDF8" stroke-width="3" />
      <path d="M152 134 C170 108 230 108 248 134" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75" />
      <ellipse cx="200" cy="174" rx="23" ry="28" fill="#F5C9A8" />
      <!-- Eyes & Smile -->
      <ellipse cx="192" cy="174" rx="4" ry="4.6" fill="#1F2937" />
      <ellipse cx="208" cy="174" rx="4" ry="4.6" fill="#1F2937" />
      <path d="M192 191 Q200 198 208 191" stroke="#B45309" stroke-width="2.8" stroke-linecap="round" fill="none" />
      <!-- Helmet chin -->
      <path d="M176 198 Q200 210 224 198 L224 206 Q200 218 176 206 Z" fill="#0369A1" stroke="#38BDF8" stroke-width="1.5" />
    </g>

    <!-- VISOR (SEPARATE SO CAN OPEN/CLOSE) -->
    <g id="visor-rider">
      <path d="M162 144 C178 122 222 122 238 144 L238 132 C222 110 178 110 162 132 Z" fill="#0F172A" stroke="#7DD3FC" stroke-width="2" />
      <circle cx="160" cy="140" r="4" fill="#0EA5E9" />
      <circle cx="240" cy="140" r="4" fill="#0EA5E9" />
    </g>

    <!-- HELMET OFFERED TO PASSENGER -->
    <g id="helmet-passenger" transform="translate(104, 458)">
      <circle cx="0" cy="0" r="44" fill="url(#helmetPassenger)" stroke="#FDA4AF" stroke-width="2.5" />
      <path d="M-32 -8 C-14 -26 14 -26 32 -8" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85" />
      <rect id="text-badge" x="-29" y="-6" width="58" height="17" rx="4.5" fill="#0F172A" opacity="0.92" />
      <text id="recipient-name" x="0" y="7" text-anchor="middle" fill="#FEF08A" font-size="10.5" font-weight="bold" font-family="sans-serif">Sayang</text>
      <path d="M-26 16 C-9 9 9 9 26 16 L21 30 C6 23 -6 23 -21 30 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <circle id="hand-grip" cx="46" cy="-28" r="14" fill="#F3C6A5" stroke="#D08B5B" stroke-width="1.5" />
    </g>

    <!-- HANDLEBARS & MIRRORS -->
    <g id="handlebars">
      <path d="M52 496 Q200 522 348 496" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round" fill="none" />
      <rect x="34" y="478" width="46" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="2" />
      <rect x="320" y="478" width="46" height="26" rx="13" fill="#1E293B" stroke="#475569" stroke-width="2" />
      <!-- Left mirror -->
      <path d="M62 488 L46 448" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="43" cy="438" rx="15" ry="11" fill="#E2E8F0" stroke="#64748B" stroke-width="2" transform="rotate(-12 43 438)" />
      <!-- Right mirror -->
      <path d="M338 488 L354 448" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
      <ellipse cx="357" cy="438" rx="15" ry="11" fill="#E2E8F0" stroke="#64748B" stroke-width="2" transform="rotate(12 357 438)" />
      <!-- Speedometer -->
      <rect x="176" y="470" width="48" height="28" rx="11" fill="#0F172A" stroke="#475569" stroke-width="2" />
      <circle cx="200" cy="484" r="7.5" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5" />
    </g>

    <!-- SCOOTER FRONT BODY & HEADLIGHT -->
    <g id="scooter-front">
      <path d="M150 526 C158 504 178 496 200 496 C222 496 242 504 250 526 L262 606 H138 Z" fill="url(#scooterPaint)" stroke="#FCD34D" stroke-width="2.5" />
      <ellipse cx="200" cy="612" rx="160" ry="62" fill="url(#povBeam)" opacity="0.45" />
      <!-- Headlight bulb -->
      <circle id="light-bulb" cx="200" cy="556" r="33" fill="#FEF08A" stroke="#F59E0B" stroke-width="4.5" />
      <circle cx="200" cy="556" r="17" fill="#FFFBEB" opacity="0.95" />
      <!-- Mudguard -->
      <ellipse cx="200" cy="648" rx="98" ry="32" fill="#D97706" stroke="#FCD34D" stroke-width="3" />
    </g>
  </g>
</svg>
